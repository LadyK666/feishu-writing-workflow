<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="670" viewBox="0 0 1600 670" role="img" aria-labelledby="title desc">
<title id="title">Fictional table: before and after</title><desc id="desc">Same Small subset, unchanged row order and values. Bold marks each metric winner independently. Score ties are both bold. Full-cell blue and teal fills show structure.</desc>
